<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Classificador de Imagens (Cloudflare)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Classificador de Imagens (Cloudflare)</h1>
      <div class="meta">
        <span id="count">0 / 0</span>
        <label class="chk">
          <input id="moveKeep" type="checkbox" />
          mover “boas” para KEEP_PREFIX
        </label>
        <label class="chk">
          <input id="permanent" type="checkbox" />
          deletar permanentemente
        </label>
      </div>
    </header>

    <section class="uploader">
      <label class="upload-label">
        <input id="dirPicker" type="file" webkitdirectory multiple hidden />
        📁 Selecionar pasta para enviar
      </label>
      <progress id="progress" value="0" max="100"></progress>
      <span id="progressText"></span>
    </section>

    <section class="viewer">
      <div class="image-holder">
        <img id="main" alt="imagem atual" />
      </div>
      <div class="controls">
        <button id="btnPrev" title="Anterior (←)">←</button>
        <button id="btnKeep" class="ok" title="Boa (A ou 1)">Boa ✓</button>
        <button id="btnDelete" class="bad" title="Ruim (D, 2 ou Backspace)">Excluir ✕</button>
        <button id="btnNext" title="Próxima (→)">→</button>
      </div>
      <p class="hint">Atalhos: ← → navega, A/1 = Boa, D/2/Backspace = Excluir</p>
    </section>

    <section class="thumbs" id="thumbs"></section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
