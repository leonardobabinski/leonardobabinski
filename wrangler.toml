name = "classificador-imagens-cloudflare"
compatibility_date = "2024-11-01"

[pages]
pages_build_output_dir = "public"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "images-bucket"

[vars]
IMAGES_PREFIX = "images/"
KEEP_PREFIX = "keep/"
TRASH_PREFIX = "trash/"
ALLOWED_EXT = "jpg,jpeg,png,webp,gif,bmp,tiff,avif"
PERMANENT_DELETE = "false"
